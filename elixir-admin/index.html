<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELIXIR 운영 관리 — 구조 재현 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F5F6F8; --surface:#fff; --line:#E3E6EC; --line2:#EEF0F4;
  --ink:#141922; --ink2:#566070; --ink3:#8A93A2;
  --accent:#2F3FA8; --accent-weak:#EEF0FB; --accent-ink:#1F2B7A;
  --ok:#14915F; --ok-weak:#E6F5EE; --bad:#D4353B; --bad-weak:#FCECEC;
  --warn:#B86E00; --warn-weak:#FDF3E1; --off:#7C8594; --off-weak:#EEF0F3;
  --r:10px; --sans:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;
  word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}

/* ---------- 틀 ---------- */
.demo{display:flex;align-items:center;gap:12px;padding:8px 20px;background:#1B2030;color:#C9CFDB;font-size:12.5px}
.demo b{color:#fff;font-weight:600}
.demo .seg{background:#2A3146}
.demo .seg button{color:#B5BCCB}
.demo .seg button[aria-pressed=true]{background:#fff;color:#1B2030}
.demo .note{margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:calc(100vh - 41px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:baseline;gap:8px;padding:2px 10px 16px}
.brand strong{font-size:17px;letter-spacing:.14em;font-weight:700}
.brand span{font-size:11.5px;color:var(--ink3)}
.nav button{display:flex;width:100%;align-items:center;gap:10px;padding:9px 10px;border:0;background:none;border-radius:8px;
  color:var(--ink2);font-weight:500;text-align:left}
.nav button:hover{background:var(--bg)}
.nav button[aria-current=page]{background:var(--accent-weak);color:var(--accent-ink);font-weight:650}
.nav .cnt{margin-left:auto;font-size:11.5px;font-weight:650;background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;line-height:18px}
.who{margin-top:auto;border-top:1px solid var(--line2);padding:14px 10px 2px}
.who .tier{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
.who .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .sc{font-size:12px;color:var(--ink3)}
main{padding:22px 26px 40px;min-width:0}
.head{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.head h1{font-size:21px;font-weight:700;letter-spacing:-.01em}
.head p{color:var(--ink2);font-size:13px;margin-top:2px}
.head .sp{margin-left:auto;display:flex;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card>h2,.sec-h{font-size:14px;font-weight:650;padding:14px 16px 0;display:flex;align-items:center;gap:6px}

/* ---------- 공통 부품 ---------- */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:#C9CFDA}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:#F0C4C6}
.btn.sm{padding:4px 10px;font-size:12.5px}
.seg{display:inline-flex;background:var(--bg);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:6px;padding:4px 10px;font-size:12.5px;font-weight:550;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,25,34,.12)}
.q{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid #C3C9D4;background:var(--surface);
  color:var(--ink3);font-size:10px;font-weight:700;line-height:1;padding:0;cursor:help;flex:none;vertical-align:middle}
.q:hover{border-color:var(--accent);color:var(--accent)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-weak);color:var(--ok)} .b-bad{background:var(--bad-weak);color:var(--bad)}
.b-warn{background:var(--warn-weak);color:var(--warn)} .b-off{background:var(--off-weak);color:var(--off)}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:-.01em;white-space:nowrap}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.muted{color:var(--ink3)} .sub{font-size:12px;color:var(--ink3)}
#tip{position:fixed;z-index:99;max-width:280px;background:#1B2030;color:#fff;font-size:12.5px;line-height:1.5;padding:8px 10px;border-radius:8px;
  pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:0 6px 20px rgba(20,25,34,.2)}
#tip.on{opacity:1}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1B2030;color:#fff;padding:10px 16px;border-radius:10px;
  font-size:13px;opacity:0;transition:.2s;z-index:98;max-width:min(520px,90vw)}
#toast.on{opacity:1;transform:translateX(-50%)}

/* ---------- 요약 수치 ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.kpi{padding:13px 16px}
.kpi .l{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:5px}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v small{font-size:13px;font-weight:550;color:var(--ink2);margin-left:3px}
.kpi.alert .v{color:var(--bad)}

/* ---------- 지도 ---------- */
.mapcard{position:relative;overflow:hidden}
.maptop{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:4px;font-size:13px;min-width:0}
.crumb button{border:0;background:none;padding:2px 4px;border-radius:5px;color:var(--ink2);font-weight:550}
.crumb button:hover{background:var(--bg);color:var(--ink)}
.crumb button:last-child{color:var(--ink);font-weight:650}
.crumb i{color:var(--ink3);font-style:normal}
.legend{margin-left:auto;display:flex;gap:12px;font-size:12px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:5px}
.legend span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
#map{display:block;width:100%;height:auto;background:#FBFCFD;cursor:grab;touch-action:none}
#map:active{cursor:grabbing}
#land path{fill:#E9ECF1;stroke:#fff;stroke-width:.6;vector-effect:non-scaling-stroke}
.bub{cursor:pointer}
.bub text{font-family:var(--sans);text-anchor:middle;pointer-events:none}
.bub .n{font-weight:700;fill:var(--ink);font-variant-numeric:tabular-nums}
.bub .lb{font-size:14px;font-weight:600;fill:var(--ink2);paint-order:stroke;stroke:#FBFCFD;stroke-width:3px}
.bub:hover .core{fill:var(--accent-weak)}
.zoomctl{position:absolute;left:14px;bottom:14px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.zoomctl button{border:0;background:none;width:32px;height:30px;font-size:16px;color:var(--ink2)}
.zoomctl button+button{border-top:1px solid var(--line2)}
.zoomctl button:hover{background:var(--bg)}
.maphint{position:absolute;left:58px;bottom:18px;font-size:12px;color:var(--ink3)}

/* 순위 패널 */
.rank{position:absolute;right:14px;bottom:14px;width:316px;max-width:calc(100% - 28px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 8px 28px rgba(20,25,34,.10)}
.rank h3{font-size:13px;font-weight:650;padding:11px 12px 8px;display:flex;align-items:center;gap:6px}
.rank .seg{margin:0 10px;display:flex;flex-wrap:wrap}
.rank .seg button{flex:1 0 auto;padding:4px 7px;font-size:12px}
.rank .range{display:flex;gap:6px;align-items:center;padding:8px 12px 0;font-size:12px;color:var(--ink2)}
.rank .range input{border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:12px;min-width:0;flex:1}
.rank ol{list-style:none;margin:6px 0 0;padding:0 4px 6px;max-height:262px;overflow:auto}
.rank li button{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;border:0;background:none;
  padding:5px 8px;border-radius:7px;text-align:left}
.rank li button:hover,.rank li button:focus-visible{background:var(--accent-weak)}
.rank .rk{font-size:12px;font-weight:700;color:var(--ink3);text-align:center;font-variant-numeric:tabular-nums}
.rank li:nth-child(-n+3) .rk{color:var(--accent)}
.rank .nm{font-weight:600;font-size:13px}
.rank .ct{font-weight:650;font-variant-numeric:tabular-nums;font-size:13px}
.rank .ct small{font-weight:500;color:var(--ink3);margin-left:1px}
.rank .empty{padding:18px 12px;color:var(--ink3);font-size:12.5px;text-align:center}
#hov{position:absolute;z-index:5;width:250px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;
  box-shadow:0 8px 28px rgba(20,25,34,.14);display:none;pointer-events:none}
#hov .t{font-weight:650;margin-bottom:2px}
#hov dl{display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 8px;margin:8px 0 0;font-size:12.5px}
#hov dt{color:var(--ink3)} #hov dd{margin:0;text-align:right}

/* ---------- 표 ---------- */
.tools{display:flex;gap:8px;align-items:center;padding:12px 14px;flex-wrap:wrap}
.tools input[type=search],.tools select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface);font-size:13px}
.tools input[type=search]{width:220px}
.tools .res{margin-left:auto;font-size:12.5px;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-weak);color:var(--accent-ink);border-radius:99px;padding:3px 4px 3px 11px;font-size:12.5px;font-weight:600;max-width:260px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{border:0;background:none;color:inherit;font-size:14px;line-height:1;padding:2px 6px;border-radius:99px}
.twrap{overflow-x:auto;border-top:1px solid var(--line2)}
table{border-collapse:collapse;width:100%;table-layout:fixed;min-width:900px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line2);vertical-align:middle;overflow:hidden}
th{font-size:12px;font-weight:600;color:var(--ink2);background:#FAFBFC;white-space:nowrap;position:sticky;top:0}
th .q{margin-left:4px}
tbody tr{cursor:pointer}
tbody tr:hover{background:#FAFBFD}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.notrow tbody tr{cursor:default}
.empty-t{padding:36px 16px;text-align:center;color:var(--ink3)}

/* ---------- 팝업 ---------- */
#modal{position:fixed;inset:0;background:rgba(20,25,34,.42);display:none;place-items:center;z-index:50;padding:20px}
#modal.on{display:grid}
.dlg{background:var(--surface);border-radius:14px;width:min(920px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(20,25,34,.3)}
.dlg.narrow{width:min(520px,100%)}
.dlg header{display:flex;align-items:flex-start;gap:12px;padding:18px 22px 14px;border-bottom:1px solid var(--line2)}
.dlg header h2{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.dlg header .x{margin-left:auto;border:0;background:none;font-size:20px;line-height:1;color:var(--ink3);padding:4px 8px;border-radius:6px}
.dlg header .x:hover{background:var(--bg)}
.dlg .body{padding:18px 22px;overflow:auto}
.dlg footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line2)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.blk+.blk{margin-top:20px}
.blk h3{font-size:12.5px;font-weight:650;color:var(--ink2);margin-bottom:8px;display:flex;align-items:center;gap:5px}
.info{display:grid;grid-template-columns:104px minmax(0,1fr);gap:7px 12px;margin:0}
.info dt{color:var(--ink3);font-size:13px}
.info dd{margin:0;font-weight:550;min-width:0;overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border:1px solid var(--line2);border-radius:8px;padding:9px 11px;min-width:0}
.tile .l{font-size:12px;color:var(--ink2);display:flex;gap:4px;align-items:center}
.tile .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v small{font-size:12px;font-weight:550;color:var(--ink3);margin-left:2px}
.bars{display:flex;align-items:flex-end;gap:6px;height:84px;padding-top:6px}
.bars div{flex:1;background:var(--accent);opacity:.85;border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars div:last-child{opacity:1}
.barlb{display:flex;gap:6px;font-size:11px;color:var(--ink3);margin-top:4px}
.barlb span{flex:1;text-align:center}
.hb{display:grid;grid-template-columns:150px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.hb.wide{grid-template-columns:minmax(0,260px) minmax(0,1fr) 54px}
.hb .tr{height:8px;background:var(--line2);border-radius:99px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hb .tr i.r{background:var(--bad)}
.prog{height:8px;background:var(--line2);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:var(--accent)}
.serial{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}
.serial div{border:1px solid var(--line);border-radius:6px;padding:4px 8px;text-align:center;min-width:0}
.serial b{display:block;font-family:var(--mono);font-size:13px;font-weight:600}
.serial span{font-size:11px;color:var(--ink3)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.callout{background:var(--warn-weak);color:#7A4A00;border-radius:8px;padding:9px 12px;font-size:12.5px;margin-top:8px}
.callout.red{background:var(--bad-weak);color:#8E1F24}
.form{display:grid;gap:12px}
.form label{display:grid;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-weight:400;color:var(--ink);background:var(--surface);width:100%}
.form textarea{min-height:96px;resize:vertical}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .hint{font-weight:400;color:var(--ink3);font-size:12px}
.form .cnt{justify-self:end;font-weight:400;color:var(--ink3);font-size:12px}
.radios{display:grid;gap:6px}
.radios label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-weight:550;color:var(--ink);cursor:pointer}
.radios label:has(input:checked){border-color:var(--accent);background:var(--accent-weak)}
.radios input{width:auto;margin-top:3px}
.radios small{display:block;font-weight:400;color:var(--ink2)}
.steps{display:flex;gap:0;margin:2px 0 4px}
.steps div{flex:1;font-size:12px;color:var(--ink3);padding-top:14px;position:relative;text-align:center}
.steps div::before{content:"";position:absolute;top:3px;left:0;right:0;height:3px;background:var(--line)}
.steps div::after{content:"";position:absolute;top:0;left:50%;margin-left:-5px;width:9px;height:9px;border-radius:50%;background:var(--line);border:2px solid var(--surface)}
.steps div.done{color:var(--ink);font-weight:600}
.steps div.done::before,.steps div.done::after{background:var(--accent)}
.quote{border-left:3px solid var(--line);padding:2px 0 2px 12px;color:var(--ink);white-space:pre-wrap}

/* ---------- VISOR 내 기기 ---------- */
.mine{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px}
.mine .card{padding:18px 20px}
.big-state{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.big-state .dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:700;flex:none}
.big-state h2{font-size:18px;font-weight:700}

@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px}
  .brand{padding:0 8px 0 4px} .nav{display:flex;gap:2px;flex-wrap:wrap} .who{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .cols,.mine{grid-template-columns:1fr}
  main{padding:16px}
  .maphint{display:none} .demo .note{display:none}
}
@media (max-width:1180px){
  .rank{position:static;width:auto;max-width:none;margin:12px;box-shadow:none}
  .rank ol{max-height:none} .maphint{display:none} .zoomctl{bottom:auto;top:58px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="demo">
  <b>시안 보기</b>
  <span>로그인 계층</span>
  <div class="seg" id="roleSeg">
    <button data-role="superall">SUPERALL · 본사</button>
    <button data-role="supervisor">SUPERVISOR · 지역</button>
    <button data-role="visor">VISOR · 단말</button>
  </div>
  <span class="note">대외비 이슈로 일부 기능을 포트폴리오용으로 제작한 화면입니다 · 숫자와 이름은 모두 예시 데이터</span>
</div>

<div class="app">
  <aside class="side">
    <div class="brand"><strong>ELIXIR</strong><span>운영 관리</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="who" id="who"></div>
  </aside>
  <main id="main"></main>
</div>

<div id="modal" role="dialog" aria-modal="true"></div>
<div id="tip" role="tooltip"></div>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
/* ============ 예시 데이터 ============ */
const TODAY = new Date('2026-10-12T14:32:00');
const PRICE = 1000;
const LATEST_FW = '2.4.1';
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R = rng(20241107);
const pick = a => a[Math.floor(R()*a.length)];
const pad = (n,l)=>String(n).padStart(l,'0');
const ymd = d => d.getFullYear()+'.'+pad(d.getMonth()+1,2)+'.'+pad(d.getDate(),2);
const addDays = (d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};

const GEO = [
 {c:'KR',name:'대한민국',ll:[127.8,36.3],regions:[

const nameOf=(d,lv)=>[d.country,d.region,d.district,d.nick][lv];
function childPts(ds,lv){const m=new Map();ds.forEach(d=>m.set(keyOf(d,lv),llOf(d,lv)));return[...m.values()]}
function fit(lls,lv,dur){
  const ps=lls.map(l=>proj(l)),xs=d3.extent(ps,p=>p[0]),ys=d3.extent(ps,p=>p[1]);
  let k=Math.min(.5*W/Math.max(xs[1]-xs[0],1e-9),.42*H/Math.max(ys[1]-ys[0],1e-9));
  k=Math.max(TH[lv]*1.15,Math.min(k,TH[lv+1]*.9));
  const t=d3.zoomIdentity.translate(CX-k*(xs[0]+xs[1])/2,H/2-k*(ys[0]+ys[1])/2).scale(k);
  const svg=d3.select('#map');(dur?svg.transition().duration(dur):svg).call(zoomB.transform,t);
}
function drawBubbles(){
  const k=curT.k, lv=k<TH[1]?0:k<TH[2]?1:k<TH[3]?2:3, ds=scopeDevs(), g=new Map();
  ds.forEach(d=>{const key=keyOf(d,lv);if(!g.has(key))g.set(key,{key,ll:llOf(d,lv),name:nameOf(d,lv),ok:0,bad:0,off:0,n:0,d});const o=g.get(key);o[kind(d)]++;o.n++});
  let html='';const items=[...g.values()].map(o=>{o.p=curT.apply(proj(o.ll));o.r=lv===3?14:Math.min(44,18+Math.sqrt(o.n)*3.4);return o});
  /* 겹치는 원은 서로 밀어내 숫자가 가려지지 않게 한다 */
  for(let it=0;it<8;it++)for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){const a=items[i],b=items[j],dx=b.p[0]-a.p[0]||.01,dy=b.p[1]-a.p[1],ds2=Math.hypot(dx,dy),min=a.r+b.r+(lv===3?44:10);
    if(ds2<min){const m=(min-ds2)/2/ds2;a.p[0]-=dx*m;a.p[1]-=dy*m;b.p[0]+=dx*m;b.p[1]+=dy*m}}
  items.forEach(o=>{const p=o.p;if(p[0]<-60||p[0]>W+60||p[1]<-60||p[1]>H+60)return;
    if(lv===3){const c={ok:'var(--ok)',bad:'var(--bad)',off:'#B4BBC7'}[kind(o.d)];
      html+=`<g class="bub" data-dev="${o.d.id}" transform="translate(${p[0].toFixed(1)},${p[1].toFixed(1)})"><circle class="core" r="12" fill="#fff" stroke="${c}" stroke-width="5"/><text class="lb" y="31">${esc(o.name.length>13?o.name.slice(0,12)+'…':o.name)}</text></g>`;return}
    const r=o.r,C=2*Math.PI*r;let off=0,arcs='';
    [['ok','var(--ok)'],['bad','var(--bad)'],['off','#B4BBC7']].forEach(([s,c])=>{if(!o[s])return;const len=C*o[s]/o.n;
      arcs+=`<circle r="${r}" fill="none" stroke="${c}" stroke-width="5" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90)"/>`;off+=len});
    html+=`<g class="bub" data-key="${o.key}" data-lv="${lv}" transform="translate(${p[0].toFixed(1)},${p[1].toFixed(1)})"><circle class="core" r="${r}" fill="#fff"/>${arcs}<text class="n" y="${r>22?6:5}" font-size="${r>22?19:16}">${o.n}</text><text class="lb" y="${r+19}">${o.name}</text></g>`});
  $('#bub').innerHTML=html;
  /* 현재 위치: 화면 가운데에서 가장 가까운 지역 */
  const c=proj.invert(curT.invert([CX,H/2])),near=l=>ds.reduce((b,d)=>{const ll=llOf(d,l),v=(ll[0]-c[0])**2+(ll[1]-c[1])**2;return v<b[0]?[v,d]:b},[Infinity,null])[1];
  let cr=S.role==='superall'?`<button data-lv="0">전 세계</button>`:'';
  for(let l=S.role==='superall'?0:2;l<lv;l++){const d=near(l);cr+=`${cr?'<i>›</i>':''}<button data-lv="${l+1}" data-key="${keyOf(d,l)}">${nameOf(d,l)}</button>`}
  $('#crumb').innerHTML=cr;
}

function openVisor(id){

  m.querySelector('#rs').onclick=()=>{if(x.value.trim().length<5){toast('문제 내용을 5자 이상 적어 주세요.');x.focus();return}
    TICKETS.unshift({id:'AS-'+pad(419+TICKETS.length,4),vid:d.id,at:new Date(TODAY),type:m.querySelector('#rt').value,text:x.value.trim(),step:0,owner:'SUPERVISOR',action:'',eta:''});
    d.fault='비정상';closeModal();render();toast('고장을 신고했습니다. SUPERVISOR와 SUPERALL에게 알림을 보냈습니다.')};
}

   <label>NICKNAME<input id="an" maxlength="24" placeholder="${sv?'예) 은평구 운영':'예) 은평구보건소'}"><span class="hint">목록과 지도에 표시되는 이름입니다. 24자까지 쓸 수 있습니다.</span></label>
   <div class="row"><label>담당자명<input></label><label>담당자 번호<input placeholder="010-0000-0000"></label></div>
   <div class="row"><label>서비스 시작일<input type="date" value="2026-10-12"></label>${sv?'<span></span>':'<label>계약 종료일<input type="date" value="2027-10-11"></label>'}</div>
  </div></div>
  <footer><button class="btn" data-close>취소</button><button class="btn pri" id="as">추가</button></footer>`,true);

/* ============ 팝업 · 도움말 공통 ============ */
function modal(html,narrow){const m=$('#modal');m.innerHTML=`<div class="dlg ${narrow?'narrow':''}">${html}</div>`;m.classList.add('on');
  m.querySelectorAll('.x,[data-close]').forEach(b=>b.onclick=closeModal)}
function closeModal(){$('#modal').classList.remove('on');$('#modal').innerHTML=''}
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function confirmBox(title,desc,okLabel,fn){modal(`<header><h2>${title}</h2><button class="x" aria-label="닫기">×</button></header><div class="body"><p>${desc}</p></div>
  <footer><button class="btn" data-close>${okLabel?'취소':'확인'}</button>${okLabel?`<button class="btn pri" id="cok">${okLabel}</button>`:''}</footer>`,true);
  const b=$('#modal #cok');if(b)b.onclick=()=>{closeModal();fn()}}
const tip=$('#tip');
function showTip(el){let t=el.dataset.tip;if(!t&&el.classList.contains('ell')&&el.scrollWidth>el.clientWidth)t=el.textContent;if(!t)return;
  tip.textContent=t;tip.classList.add('on');const r=el.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
  tip.style.left=Math.max(8,Math.min(r.left+r.width/2-tw/2,innerWidth-tw-8))+'px';tip.style.top=(r.top-th-8<8?r.bottom+8:r.top-th-8)+'px'}
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip],.ell');el?showTip(el):tip.classList.remove('on')});
document.addEventListener('focusin',e=>{const el=e.target.closest('[data-tip]');if(el)showTip(el)});
document.addEventListener('focusout',()=>tip.classList.remove('on'));
window.addEventListener('scroll',()=>tip.classList.remove('on'),true);

render();
</script>
